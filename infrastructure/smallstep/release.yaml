                    "options": { "x509": {}, "ssh": {} },
                  }
                - type: ACME
                  name: acme
            tls:
              cipherSuites:
                - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
                - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
              minVersion: 1.2
              maxVersion: 1.3
              renegotiation: false

          defaults.json:
            ca-url: https://ca.homelab.local
            ca-config: /home/step/config/ca.json
            fingerprint: ad1aa11c806f556f71c1573e96148ede75816f48856a423d0473d0c63666c655
            root: /home/step/certs/root_ca.crt


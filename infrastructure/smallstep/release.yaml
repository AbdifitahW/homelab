apiVersion: v1
kind: Namespace
metadata:
  name: step-ca
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: step-ca
  namespace: step-ca
spec:
  interval: 5m
  chart:
    spec:
      chart: step-certificates
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: smallstep
        namespace: flux-system
      version: "1.29"
  values:
    inject:
      config:
        files:
          ca.json:
            authority:
              provisioners:
                - name: acme
                  type: ACME

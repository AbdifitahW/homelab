apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: step-ca
  namespace: step-ca
spec:
  interval: 5m
  chart:
    spec:
      chart: step-certificates
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: smallstep
      version: "1.29"
  values:
    bootstrap:
      enabled: true
      email: admin@homlab.local
    service:
      dnsNames:
        - step-ca.homelab.local

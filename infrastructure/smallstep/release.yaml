apiVersion: v1
kind: Namespace
metadata:
  name: step-ca
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: step-ca
  namespace: step-ca
spec:
  interval: 5m
  chart:
    spec:
      chart: step-certificates
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: smallstep
        namespace: flux-system
      version: "1.29"
  # Helm template
  values:
    inject:
      enabled: true
      # Config contains the configuration files ca.json and defaults.json
      config:
        files:
          ca.json:
            root: /home/step/certs/root_ca.crt
            federateRoots: []
            crt: /home/step/certs/intermediate_ca.crt
            key: /home/step/secrets/intermediate_ca_key
            address: :9000
            dnsNames:
              - ca.homelab.local
            logger:
              format: json
            db:
              type: badgerv2
              dataSource: /home/step/db
            authority:
              enableAdmin: false
              provisioners:
                - {
                    "type": "JWK",
                    "name": "admin",
                    "key":
                      {
                        "use": "sig",
                        "kty": "EC",
                        "kid": "glKSMI_YHVIckAhddbZ05v_kmpIydgBOzFonkJSWyB4",
                        "crv": "P-256",
                        "alg": "ES256",
                        "x": "MVkoCEpEEVHf7KCcCJEtI83mFxwy4ZJz7WGr7dFphU8",
                        "y": "TE5UQB05fmHTxwrF1cOIxGcjgR9wc9EG0fdgnfUmQwg",
                      },
                    "encryptedKey": "eyJhbGciOiJQQkVTMi1IUzI1NitBMTI4S1ciLCJjdHkiOiJqd2sranNvbiIsImVuYyI6IkEyNTZHQ00iLCJwMmMiOjYwMDAwMCwicDJzIjoiQjZteEU2Qk1Mb2RRbEd3QTJJS3ZOZyJ9.Dz5O8aRsisETQ2OLPRR3Vj_50h25tb_qLAVkZlipoOd45LqYyzhvng.6ZMDn8TN4hpjJDm2.567Z-TDXD8FagxyIx8gMEZd6PDW_CV650oo3ThiLSjixGePA9WgUqJgvvv_LsMG_3hMHQywWXO7VFFUlPhH8rZoJ9bNq7WWUqXt3dOdXEJ1Vl_oAeWjsEoAX5jWq4Pdb9cBtLeNUfDY75MNkwMg3XIXnzqZ5gVe5qPGAGEkLKkZX5rNkjf8SwyBCZGu8X90yotfaGpoHkEhJpJabBe2uDksZTXtSTw2ZkxOBX-RfFpd_R4pRtmwl1n1xXcdvRqbjubMQVcDGNA4p91eoidBBRLjFZ4V8LVNR7x4VOINUq2-JBIqiEE3X3zh5fPB4_jQPOpSYqK2ERwlYSQLq8xc.D3srBKqoYUWZ-sNLmXxz-w",
                    "options": { "x509": {}, "ssh": {} },
                  }
                - type: ACME
                  name: acme
            tls:
              cipherSuites:
                - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
                - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
              minVersion: 1.2
              maxVersion: 1.3
              renegotiation: false

          defaults.json:
            ca-url: https://ca.homelab.local
            ca-config: /home/step/config/ca.json
            fingerprint: 141f8fef47d42045246acf65ecf09bc691bfaf640ec0d9e37125e800f8a58a25
            root: /home/step/certs/root_ca.crt

      # Certificates contains the root and intermediate certificate and
      # optionally the SSH host and user public keys
      certificates:
        # intermediate_ca contains the text of the intermediate CA Certificate
        intermediate_ca: |

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: kube-system
spec:
  interval: 5m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: pihole
      version: "2.35.0"
      sourceRef:
        kind: HelmRepository
        name: pihole
        namespace: flux-system
  timeout: 10m
  values:
    admin:
      enabled: true
      existingSecrets: "pihole-secret"
      passwordKey: "password"
    dnsmasq:
      customDnsEntries:
        - address=/.homelab.local/10.0.0.230
    serviceDns:
      mixedService: true
      type: LoadBalancer
      annotations:
        metallb.universe.tf/allow-shared-ip: pihole-svc
      externalTrafficPolicy: Cluster

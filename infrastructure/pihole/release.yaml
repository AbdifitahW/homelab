apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pihole
  namespace: kube-system
spec:
  interval: 5m
  chart:
    spec:
      chart: pihole
      sourceRef:
        kind: HelmRepository
        name: pihole
        namespace: flux-system
  timeout: 10m
  values:
    dnsmasq:
      customDnsEntries:
        - address=/.homelab.local/10.0.0.230
    service:
      type: LoadBalancer

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1m
  chartRef:
    kind: OCIRepository
    name: traefik
    namespace: flux-system
  timeout: 10m
  install:
    disableWait: true
  upgrade:
    disableWait: true
  rollback:
    disableWait: true
  values:
    web:
      port: 80
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    deployment:
      initContainers:
        # The "volume-permissions" init container is required if you run into permission issues.
        # Related issue: https://github.com/traefik/traefik-helm-chart/issues/396
        - name: volume-permissions
          image: busybox:1.37
          command:
            [
              "sh",
              "-c",
              "touch /data/acme.json; chmod -v 600 /data/acme.json; adduser -S 65532 65532; chown -R 65532:65532 /data/acme.json",
            ]
          volumeMounts:
            - name: data
              mountPath: /data
    volumes:
      - name: step-ca-root-cert
        type: configMap
        mountPath: /data/step-ca
    env:
      - name: LEGO_CA_CERTIFICATES
        value: /data/step-ca/root_ca.crt
    persistence:
      enabled: true
      path: /data
      name: data
      size: 1Gi
    certificatesResolvers:
      homelab:
        acme:
          email: admin
          caServer: https://step-ca-step-certificates.step-ca.svc.cluster.local/acme/acme/directory
          storage: /data/acme.json
          certificatesDuration: 72
          tlsChallenge: true
    podSecurityContext:
      runAsGroup: 65532
      runAsNonRoot: true
      runAsUser: 65532
      fsGroup: 65532
      fsGroupChangePolicy: "OnRootMismatch"

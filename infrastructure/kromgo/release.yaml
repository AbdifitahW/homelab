---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kromgo
  namespace: monitoring
spec:
  interval: 15m
  chartRef:
    kind: OCIRepository
    name: kromgo
    namespace: flux-system
  driftDetection:
    mode: enabled
  values:
    controllers:
      kromgo:
        strategy: RollingUpdate
        replicas: 1
        containers:
          kromgo:
            image:
              repository: ghcr.io/kashalls/kromgo
              tag: v0.7.5
            env:
              PROMETHEUS_URL: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
              SERVER_PORT: &port 80
              HEALTH_PORT: &hport 8080
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *hport
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
    service:
      kromgo:
        controller: kromgo
        ports:
          http:
            port: *port
    ingress:
      kromgo:
        annotations:
          kubernetes.io/ingress.class: traefik
          traefik.ingress.kubernetes.io/router.tls: "true"
          traefik.ingress.kubernetes.io/router.tls.certresolver: home
        hosts:
          - host: kromgo.homelab.local
            paths:
              - path: /
                pathType: Prefix
                service:
                  identifier: kromgo
                  port: *port
    persistence:
      config-file:
        type: configMap
        name: kromgo-cm
        globalMounts:
          - path: /kromgo/config.yaml
            subPath: config.yaml
            readOnly: true
